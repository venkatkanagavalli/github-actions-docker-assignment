name: Docker Build Tag Push

description: Build, tag and push Docker image to Docker Hub

inputs:
  username:
    description: Docker Hub username
    required: true

  password:
    description: Docker Hub access token
    required: true

  image-name:
    description: Docker Hub image name
    required: true

  image-tag:
    description: Docker image tag
    required: true

runs:
  using: composite

  steps:

    - name: Login to Docker Hub
      shell: bash
      run: |
        echo "${{ inputs.password }}" | docker login \
          -u "${{ inputs.username }}" \
          --password-stdin

    - name: Build Docker image
      shell: bash
      run: |
        docker build \
          -t employee-api:${{ inputs.image-tag }} \
          .

    - name: Tag Docker image
      shell: bash
      run: |
        docker tag \
          employee-api:${{ inputs.image-tag }} \
          "${{ inputs.image-name }}:${{ inputs.image-tag }}"

    - name: Push Docker image
      shell: bash
      run: |
        docker push \
          "${{ inputs.image-name }}:${{ inputs.image-tag }}"